name: Android - compilación y pruebas

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  verificar-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android API 37
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar Android y ejecutar pruebas del host
        run: bash ./gradlew :androidApp:assembleDebug :shared:testAndroidHostTest --stacktrace
