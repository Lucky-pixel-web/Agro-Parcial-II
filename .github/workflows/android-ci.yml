name: Android - compilación y pruebas

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  verificar-android:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar Android API 37
        run: |
          sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0"
          if [ ! -d "$ANDROID_SDK_ROOT/platforms/android-37" ] && [ -d "$ANDROID_SDK_ROOT/platforms/android-37.0" ]; then
            ln -s "$ANDROID_SDK_ROOT/platforms/android-37.0" "$ANDROID_SDK_ROOT/platforms/android-37"
          fi

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar Android y ejecutar pruebas del host
        run: bash ./gradlew :androidApp:assembleDebug :shared:testAndroidHostTest --stacktrace
